# HorizontalPodAutoscaler — watches average CPU on nginx-demo pods.
# When per-pod CPU exceeds 50% of its `requests.cpu` (25m), scales out.
# Idle pods → scales back down to minReplicas.
#
# Demo: hammer the ingress with `hey` and watch replicas climb.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-demo

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

  # Behavior tunes the scale-up/scale-down curves. Defaults are conservative;
  # for a demo we want fast scale-up (so the load test triggers it visibly)
  # and slow scale-down (so we see the peak before it shrinks back).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100 # double the pod count
          periodSeconds: 30
        - type: Pods
          value: 4 # OR add up to 4 pods at once
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 min of low load before scaling down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
